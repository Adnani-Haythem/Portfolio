<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 749" role="img" aria-labelledby="title desc">
  <title id="title">Haythem Adnani placeholder portrait</title>
  <desc id="desc">Abstract initials placeholder to replace with a personal portrait.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#24364a"/>
      <stop offset="65%" stop-color="#111822"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#69b7ff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#d7e2ea" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#69b7ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <ellipse cx="436" cy="386" rx="300" ry="330" fill="url(#bg)"/>
  <ellipse cx="436" cy="365" rx="238" ry="260" fill="#121a24" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="436" cy="330" r="150" fill="#182536" stroke="#69b7ff" stroke-opacity="0.25" stroke-width="2"/>
  <text x="436" y="365" text-anchor="middle" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="130" font-weight="700" letter-spacing="8">HA</text>
  <text x="436" y="435" text-anchor="middle" fill="#94a9bd" font-family="monospace" font-size="24" letter-spacing="4">ADD YOUR PORTRAIT</text>
</svg>
